[workspace]
members = ["registry"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "26.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true